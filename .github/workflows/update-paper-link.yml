name: Update published Paper link

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-paper-link.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Preserve published assets and enable the Paper link
        env:
          PUBLISHED_SITE_DIR: ${{ runner.temp }}/published-site
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urldefrag, urljoin, urlsplit
          from urllib.request import urlopen

          base = 'https://sihhangchen.github.io/RoboCasa-Mem/'
          base_url = urlsplit(base)
          output = Path(os.environ['PUBLISHED_SITE_DIR'])
          output.mkdir(parents=True, exist_ok=True)

          def read(url):
              for attempt in range(3):
                  try:
                      with urlopen(url, timeout=60) as response:
                          return response.read()
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2)

          html = read(base).decode('utf-8')
          pattern = r'<button\b[^>]*aria-label="Paper \(coming soon\)"[^>]*>(.*?)</button>'
          html, count = re.subn(
              pattern,
              lambda m: '<a class="button button-secondary" href="https://arxiv.org/pdf/2611.06475" rel="noopener noreferrer">' + m[1] + '</a>',
              html,
              flags=re.DOTALL,
          )
          assert count == 1, f'Expected one disabled Paper button, found {count}'

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in ('href', 'src', 'poster') or not value or value.startswith('#'):
                          continue
                      url = urldefrag(urljoin(base, value))[0]
                      parsed = urlsplit(url)
                      if parsed.netloc == base_url.netloc and parsed.path.startswith(base_url.path) and parsed.path != base_url.path:
                          self.urls.add(url)

          assets = Assets()
          assets.feed(html)
          assert len([u for u in assets.urls if u.endswith('.mp4')]) == 9

          def save(url):
              relative = unquote(urlsplit(url).path[len(base_url.path):])
              assert '..' not in Path(relative).parts
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              content = read(url)
              assert content, f'Empty asset: {url}'
              target.write_bytes(content)

          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(save, sorted(assets.urls)))
          (output / 'index.html').write_text(html, encoding='utf-8')
          (output / '.nojekyll').touch()
          print(f'Preserved {len(assets.urls)} published assets; enabled Paper link')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/published-site
      - name: Publish updated page
        id: deployment
        uses: actions/deploy-pages@v4
