# 50 held-out seeds (1050-1099), consistent with the other task full suites.
# WR-06: return the ketchup bottle to its original shelf level.
# stop_on_success=false: the returned bottle must remain valid for the full rollout.

suite_version: wr06_full_50seeds_v1

task:
  id: WR-06
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wr06/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: {start: 1050, stop: 1100}

rollout:
  replan_steps: 50
  action_repeat: 1
  stop_on_success: false
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
