# WR-03 full evaluation suite for GR00T N1.7 policies.
# 50 held-out seeds (1050-1099), disjoint from the training seed range.
# replan_steps=20 replans each full GR00T chunk (chunk_size=40) twice.
# WR-03 demos average ~2500 steps (store -> close doors -> retrieve from
# memory), so max_steps=4800 gives the policy ~1.9x the expert length as
# headroom. stop_on_success=false continues to max_steps so a stable early
# return is validated, not trusted.

suite_version: wr03_gr00t_50seeds_v1

task:
  id: WR-03
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wr03/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: {start: 1050, stop: 1100}

rollout:
  replan_steps: 10
  max_steps: 8000
  action_repeat: 1
  stop_on_success: false
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
