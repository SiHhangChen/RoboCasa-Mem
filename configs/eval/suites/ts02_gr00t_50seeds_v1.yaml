# TS02 full evaluation suite for GR00T N1.7 LoRA policies.
# 50 held-out seeds (1050-1099), disjoint from the training seed range.
# replan_steps=20 executes the first half of each 40-step GR00T chunk and then
# re-plans, matching the WR-03/WR-04/TS-03 GR00T convention.
# max_steps=2200 == TS02 task max_horizon (resolver caps suite max_steps at the
# task horizon; expert demos average well below this). stop_on_success=true: a
# plausible terminal
# success never gets revoked later.

suite_version: ts02_gr00t_50seeds_v1

task:
  id: TS02
  env_split: pretrain
  options:
    task_config_file: bench/tasks/ts02/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: {start: 1050, stop: 1100}

rollout:
  replan_steps: 20
  max_steps: 2200
  action_repeat: 1
  stop_on_success: true
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0