# TS01 K/N coverage suite: three deterministic seeds for each supported cell.
# TS01 samples K in {1,2,3} and N in [K,5], giving 12 reportable cells.

suite_version: ts01_k_n_coverage_v1

task:
  id: TS01
  env_split: pretrain
  options:
    task_config_file: bench/tasks/ts01/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: [
  1014, 1031, 1040,  # K1 N1
  1005, 1048, 1091,  # K1 N2
  1001, 1004, 1017,  # K1 N3
  1020, 1033, 1049,  # K1 N4
  1023, 1024, 1042,  # K1 N5
  1002, 1018, 1022,  # K2 N2
  1003, 1006, 1007,  # K2 N3
  1000, 1011, 1013,  # K2 N4
  1008, 1021, 1030,  # K2 N5
  1015, 1025, 1029,  # K3 N3
  1019, 1043, 1045,  # K3 N4
  1010, 1012, 1016,  # K3 N5
]

rollout:
  replan_steps: 50
  max_steps: 2800
  action_repeat: 1
  stop_on_success: true
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
