# Full WA-01 closed-loop rollout: MemER selects subtasks, OpenPI executes them.
suite_version: wa01_memer_full_v1

task:
  id: WA-01
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wa01/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: [1050]

rollout:
  max_steps: 5000
  # MemER was trained with stride10. The low-level OpenPI server may return a
  # 50-step action chunk; the runner consumes only 10 before re-querying both.
  replan_steps: 10
  action_repeat: 1
  stop_on_success: true
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 90.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
