# WR-04 full evaluation suite for GR00T N1.7 policies.
# 50 held-out seeds (1050-1099), disjoint from the training seed range (0-213).
# replan_steps=40 executes each full GR00T chunk (chunk_size=40) once.

suite_version: wr04_gr00t_50seeds_v1

task:
  id: WR-04
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wr04/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: {start: 1050, stop: 1100}

rollout:
  replan_steps: 20
  max_steps: 3200
  action_repeat: 1
  # A stable return is only a candidate success. Continue to max_steps so a
  # later repeated manipulation can revoke it.
  stop_on_success: false
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
