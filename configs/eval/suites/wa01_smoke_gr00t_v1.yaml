# WA-01 smoke suite for GR00T N1.7 policies (action horizon 40).
# Mirrors wa01_smoke_v1.yaml with replan_steps matched to the GR00T chunk size.

suite_version: wa01_smoke_gr00t_v1

task:
  id: WA-01
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wa01/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: [1050, 1070, 1085]

rollout:
  replan_steps: 40
  action_repeat: 1
  stop_on_success: true
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
