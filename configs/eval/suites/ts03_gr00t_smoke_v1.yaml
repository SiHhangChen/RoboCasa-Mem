# TS03 GR00T smoke suite: one seed per K/N hierarchy profile.
# seeds 1050-1053 map to profile order k2_n2, k2_n3, k1_n2, k1_n3 (seed % 4).

suite_version: ts03_gr00t_smoke_v1

task:
  id: TS03
  env_split: pretrain
  options:
    task_config_file: bench/tasks/ts03/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: [1050, 1051, 1052, 1053]

rollout:
  replan_steps: 20
  max_steps: 2800
  action_repeat: 1
  stop_on_success: true
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
