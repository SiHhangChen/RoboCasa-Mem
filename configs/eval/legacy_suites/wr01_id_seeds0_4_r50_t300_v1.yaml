# WR-01 dataset-ID probe on the first five training seeds.
suite_version: wr01_id_seeds0_4_r50_t300_v1

task:
  id: WR-01
  env_split: pretrain
  options:
    task_config_file: bench/tasks/wr01/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml

seeds: {start: 0, stop: 5}

rollout:
  max_steps: 5000
  replan_steps: 50
  action_repeat: 1
  stop_on_success: true
  ignore_done: true

artifacts:
  record_video: true
  video_cameras: [agentview_left, agentview_right, eye_in_hand]
  video_fps: 20

transport:
  timeout_s: 300.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
