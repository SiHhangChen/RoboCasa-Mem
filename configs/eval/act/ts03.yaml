# Official act evaluation for TS-03, seeds 1050-1099.
suite_version: ts03_act_v2
task:
  id: TS-03
  env_split: pretrain
  options:
    task_config_file: bench/tasks/ts03/resources/task.yaml
    observation_profile_file: configs/benchmark/observation_profiles/rgbd_v3.yaml
seeds:
  start: 1050
  stop: 1100
rollout:
  max_steps: 1800
  replan_steps: 50
  action_repeat: 1
  stop_on_success: true
  ignore_done: true
artifacts:
  record_video: true
  video_cameras:
  - agentview_left
  - agentview_right
  - eye_in_hand
  video_fps: 20
transport:
  timeout_s: 30.0
  connect_attempts: 10
  connect_retry_delay_s: 2.0
  inference_retries: 0
