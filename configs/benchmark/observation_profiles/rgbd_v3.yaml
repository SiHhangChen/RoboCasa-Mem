# Immutable observation contract shared by recording and evaluation.
schema_version: 3
profile_id: rgbd_v3
description: RoboCasa PandaOmron three-camera RGB-D profile in OpenCV convention.

cameras:
  - alias: agentview_left
    name: robot0_agentview_left
  - alias: agentview_right
    name: robot0_agentview_right
  - alias: eye_in_hand
    name: robot0_eye_in_hand

image:
  width: 224
  height: 224

modalities:
  rgb: true
  depth: true

renderer:
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_observations: true
