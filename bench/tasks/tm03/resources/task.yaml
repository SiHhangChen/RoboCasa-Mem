schema_version: 1

task:
  id: TM03
  display_name: Boil Water, Inspect Two Drawers, and Run Toaster Oven
  description: Interleave stove, drawer, and toaster-oven task threads.
  canonical_prompt: >-
    First, use the stove's own control knob to turn on the burner under the pot. The toaster oven already contains food and its door must remain closed. Next, start the toaster oven by turning its own timer knob and inspect one of the two drawers, in either order; inspect a drawer by opening it, looking inside, and closing it. After the toaster oven has been started and one drawer has been inspected, complete the three remaining steps in any order: turn off the burner with the same stove knob, stop the toaster oven by returning the same timer knob to zero, and inspect the other drawer. When the burner and toaster oven are off and both drawers have been inspected and closed, press either green completion button.
  canonical_prompt_sha256: 1ac55eb1ff09aaf22186bc47203d7cc93e7ebc82f63bafdc73027e955c1f6f73
  success_conditions:
    - legal_event_route
    - native_knob_on_once
    - native_knob_off_once
    - toaster_oven_started_once
    - toaster_oven_stopped_once
    - burner_off
    - toaster_oven_off
    - toaster_oven_door_closed
    - toaster_oven_food_inside
    - both_drawers_checked_once
    - all_drawers_closed
    - pot_stable
    - either_completion_button_pressed
    - no_absorbing_failure
    - fixed_prompt

scene:
  env_name: TM03BoilWaterInspectDrawersAndRunToasterOven
  fixed_scene: true
  layout_id: 39
  style_id: 24
  scene_seed: 0
  drawer_names: [drawer_left, drawer_right]
  drawer_world_xyzs:
    - [4.10, -2.37, 1.1363333333333332]
    - [4.60, -2.37, 1.1363333333333332]
  drawer_world_yaw_deg: 180.0
  task_added_button_names:
    - completion_button_drawer_side
    - completion_button_stove_side
  completion_button_world_xyzs:
    completion_button_drawer_side: [3.55, -2.40, 0.92]
    completion_button_stove_side: [4.30, -3.30, 0.92]
  expected_stove_asset: Stovetop057
  stove_knob_id: front_right
  burner_id: rear_left
  stove_knob_joint: knob_front_right_joint
  stove_knob_collision_geom: knob_front_right_main
  stove_burner_site: burner_on_rear_left
  pot_name: pot
  pot_xml: objects/lightwheel/saucepan/Saucepan002/model.xml
  expected_toaster_oven_asset: ToasterOven059
  toaster_oven_food_name: toaster_oven_food
  toaster_oven_food_xml: objects/objaverse/waffle/waffle_0/model.xml
  toaster_oven_time_joint: knob_time_joint
  toaster_oven_time_collision_geom: knob_time_main

episode:
  plan_balance: seed_mod_24
  max_horizon: 4800

initial_state:
  robot_base_sample_index: 0
  drawers_closed_fraction: 0.0
  all_burners_off: true
  toaster_oven_off: true
  toaster_oven_door_closed: true
  toaster_oven_food_inside: true
  settle_steps: 20

semantics:
  drawer_open_threshold: 0.70
  drawer_closed_threshold: 0.08
  inspect_dwell_steps: 10
  completion_button_pressed_threshold_m: 0.004
  completion_button_released_threshold_m: 0.001
  completion_button_release_dwell_steps: 3
  pot_burner_xy_threshold_m: 0.08
  pot_translation_guard_m: 0.02
  pot_tilt_guard_deg: 5.0
  reject_simultaneous_semantic_events: true
  absorbing_order_failures: true

appliance:
  control_mode: native_stove_knob_contact
  off_commit_max_rad: 0.10
  burner_on_min_rad: 0.35
  on_commit_min_rad: 0.50
  commit_dwell_steps: 3
  min_gripper_contact_steps: 3
  contact_evidence_window_steps: 20
  min_interaction_motion_rad: 0.40
  max_unexplained_delta_rad_per_step: 0.25
  require_gripper_or_finger_contact: true
  forbid_direct_qpos_write_after_reset: true
  forbid_knob_actuator_command_after_reset: true
  require_all_other_burners_off: true

toaster_oven:
  control_mode: native_time_knob_contact
  expected_asset: ToasterOven059
  door_must_remain_closed: true
  food_must_remain_inside: true
  forbid_direct_state_write_after_reset: true
  forbid_knob_actuator_command_after_reset: true
  off_commit_max_rad: 0.10
  on_min_rad: 0.35
  on_commit_min_rad: 0.50
  commit_dwell_steps: 3
  min_gripper_contact_steps: 3
  contact_evidence_window_steps: 20
  min_interaction_motion_rad: 0.40
  max_unexplained_delta_rad_per_step: 0.25

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  stove_knob_interaction_poses: calibration/stove_knob/interaction_poses.json
  stove_knob_pinch_off_pose: calibration/stove_knob/pinch_off.json
  stove_knob_pinch_on_pose: calibration/stove_knob/pinch_on.json
  drawer_grasp_pose: calibration/cabinet_slot_1_hook_pose.json
  toaster_oven_interaction_poses: calibration/toaster_oven_time_knob/interaction_poses.json
  toaster_oven_time_pinch_off_pose: calibration/toaster_oven_time_knob/pinch_off.json
  toaster_oven_time_pinch_on_pose: calibration/toaster_oven_time_knob/pinch_on.json
  toaster_oven_time_pinch_on_for_off_pose: calibration/toaster_oven_time_knob/pinch_on_for_off.json
  manual_base_path: navigation/manual_base_path_layout39_style24_seed0.json
  planner_script: ../../../execution/planning/mplib_planner.py

navigation:
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.030
  manual_base_path_yaw_tolerance: 0.06
  use_station_base_poses: false
  use_station_astar_paths: false

manipulation:
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
  runtime:
    max_joint_step: 0.015
    settle_steps: 20
    position_threshold: 0.10
    orientation_threshold_deg: 20.0
    qpos_threshold: 0.18
  static_scene:
    enabled: false
    validate_collisions: false

operations:
  stove_knob_on:
    actuation_mode: pinch_and_rotate_native_knob
    target_qpos_rad: 1.5707963267948966
    require_contact_evidence: true
  stove_knob_off:
    actuation_mode: pinch_and_rotate_native_knob
    target_qpos_rad: 0.0
    require_contact_evidence: true
  drawer_open:
    actuation_mode: contact
    open_fraction: 1.0
    hook_orientation_blend: 0.90
    prehook_distance: 0.125
    hook_offset: 0.005
    pull_distance: 0.18
    open_fraction_threshold: 0.70
    gripper_steps: 25
    grasp_pose_resource: drawer_grasp_pose
    close_gripper_on_hook: true
    close_gripper_action: 1.0
    close_gripper_steps: 25
  inspect:
    dwell_steps: 10
  drawer_close:
    actuation_mode: contact
    closed_fraction: 0.0
    close_overshoot: 0.005
    closed_fraction_threshold: 0.08
    return_arm_after_close: false
  toaster_oven_start:
    knob: time
    target_qpos_rad: 1.5707963267948966
    require_contact_evidence: true
  toaster_oven_stop:
    knob: time
    target_qpos_rad: 0.0
    require_contact_evidence: true
  completion_button:
    hold_steps: 12
    press_depth_threshold_m: 0.004
    require_physical_button_motion: true

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
