# WX-02 fourteen-stage production task. Dataset storage remains CLI-owned.
schema_version: 1

task:
  id: WX-02
  display_name: Clean under two cups and return them
  description: Fetch a sponge, clean the stains hidden under two cups one at a time, return both cups to their remembered origins, then return the sponge.
  success_conditions:
    - cleaning_tool_acquired
    - primary_cup_moved
    - primary_stain_cleaned
    - primary_cup_at_origin
    - primary_cup_on_dining_table
    - secondary_cup_moved
    - secondary_stain_cleaned
    - secondary_cup_at_origin
    - secondary_cup_on_dining_table
    - cleaning_tool_released
    - cleaning_tool_in_return_region
    - cleaning_tool_on_dining_table

scene:
  env_name: WX02CleanUnderCupAndReturnIt
  fixed_scene: true
  layout_id: 38
  style_id: 38
  scene_seed: 0
  cup_scale: 0.9
  cup_placement_size: [0.16, 0.20]
  primary_cup_placement_pos: [1.0, 1.0]
  secondary_cup_placement_pos: [1.0, 0.55]
  cup_rotation_deg: [0.0, 0.0]
  # TM02-style marked placement region on the dining table. The marker is
  # visual-only; the real dining-table surface supports the released sponge.
  cleaning_tool_return_region_center_xy: [2.50, -4.62]
  cleaning_tool_return_region_size_xy: [0.22, 0.20]
  cleaning_tool_return_region_rgba: [0.96, 0.72, 0.16, 0.72]

episode:
  start_mode: cup_front_unheld
  max_horizon: 5200
  temporary_targets:
    # World-frame regions are independent of each cup's initial pose, so the
    # temporary placement cannot be inverted to recover the remembered origin.
    object_region_center_xy: [2.78, -3.82]
    object_region_size_xy: [0.10, 0.10]
    object_seed_offsets:
      primary_cup: 500
      secondary_cup: 600
    staged_tool_region_center_xy: [2.74, -4.30]
    staged_tool_region_size_xy: [0.06, 0.04]
    staged_tool_seed_offset: 1000
  wipe_sampling:
    seed_offset: 2000
    half_length: 0.07
    pass_count: 3
    # Restrict sweeps to the reliable left-right sector. Near-world-X
    # front-back sweeps frequently fail while reversing at wipe_02.
    angle_range_deg: [60.0, 120.0]
    angle_offset_deg: 0.0

initial_state:
  robot_base:
    mode: manual_path_sample
    # The recorded episode opens at the dining table with the original cup
    # and its still-hidden stain in view.
    sample_index: 1
  objects:
    enabled: true
    primary_cup:
      center_xy: [2.52, -3.62]
      size_xy: [0.12, 0.12]
      rotation_deg: [0.0, 0.0]
      seed_offset: 0
    secondary_cup:
      center_xy: [2.52, -4.02]
      size_xy: [0.12, 0.12]
      rotation_deg: [0.0, 0.0]
      seed_offset: 50
    cleaning_tool:
      center_xy: [2.50, -4.62]
      size_xy: [0.06, 0.04]
      rotation_deg: [0.0, 0.0]
      seed_offset: 100
  short_start:
    mode: cup_front_unheld
    setup_operation: none
    cleaning_tool:
      lift_height: 0.20
      transport_probe_height: 0.03
      max_end_effector_distance: 0.10
      max_relative_offset_drift: 0.02
      minimum_motion_ratio: 0.70

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  station_poses: station/stations.json
  manual_base_path: navigation/manual_base_path_layout38_style38_seed0.json
  planner_script: ../../../execution/planning/mplib_planner.py
  cleaning_tool_grasp_pose: poses/cleaning_tool_grasp.json
  cup_grasp_candidates: poses/blocking_cup_single_wall_grasp_candidates.json

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.025
  base_yaw_tolerance: 0.06
  base_max_steps: 1500
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.030
  manual_base_path_yaw_tolerance: 0.06
  base_single_axis_tracking: false
  base_terminal_yaw_distance: 0.05
  base_snap_to_target_after_success: false
  base_profile_v_max: 0.90
  base_profile_a_max: 1.55
  base_profile_a_dec: 1.75
  base_profile_v_min: 0.18
  base_profile_w_max: 0.90
  base_profile_alpha_max: 1.70
  base_profile_alpha_dec: 1.55
  base_profile_w_min: 0.10
  use_station_astar_paths: false
  station_nav_use_docking: false
  station_nav_dock_standoff: 0.0
  station_nav_require_footprint: false
  use_station_base_poses: true

manipulation:
  pick_place:
    orientation_mode: object-y-topdown
    mug_orientation_mode: object-y-topdown
    pregrasp_height: 0.20
    grasp_clearance: -0.05
    lift_height: 0.12
    mug_lift_height: 0.08
    grasp_yaw_offset_deg: 0.0
    place_height: 0.16
    retreat_height: 0.30
    retreat_x: -0.10
    retreat_y: -0.18
    release_offset_x: 0.0
    release_offset_y: 0.0
    post_release_clearance_distance: 0.0
    post_release_clearance_z_offset: 0.0
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
  runtime:
    max_joint_step: 0.02
    settle_steps: 5
    position_threshold: 0.06
    orientation_threshold_deg: 10.0
    qpos_threshold: 0.08
    open_steps: 6
    close_steps: 32
    release_steps: 12
    release_settle_steps: 6
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: counter,dining,sink,cabinet
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: lift,retreat
    min_z: 1.0
    max_points: 4000

operations:
  observe:
    settle_steps: 10
    gripper_action: -1.0
  cleaning_tool_pick:
    lift_height: 0.20
  staged_tool_place:
    place_height: 0.0
    retreat_height: 0.12
    retreat_x: -0.06
    retreat_y: -0.06
    post_release_clearance_z_offset: 0.12
    target_max_base_x: 0.56
  object_temporary_place:
    place_height: 0.0
    placement_object_upright: true
    post_release_clearance_z_offset: 0.12
    retreat_height: 0.18
    retreat_x: 0.0
    retreat_y: 0.0
    target_max_base_x: 0.66
  wipe:
    plan_execute_wipe_sweep: true
    contact_z_offset: 0.005
    settle_steps: 8
    allow_final_qpos_near_miss: true
    max_final_qpos_error: 0.30
  post_wipe_tool_place:
    place_height: 0.0
    retreat_height: 0.10
    retreat_x: -0.06
    retreat_y: -0.06
    post_release_clearance_z_offset: 0.12
    target_max_base_x: 0.56
  object_pick:
    grasp_strategy: single-wall-topdown
    lift_height: 0.12
    object_max_base_x: 0.66
  object_origin_place:
    place_height: 0.0
    placement_object_upright: true
    placement_approach_angles_deg: [0.0]
    placement_entry_standoff: 0.0
    placement_entry_z_offset: 0.12
    placement_exit_standoff: 0.0
    placement_exit_z_offset: 0.18
    post_release_clearance_distance: 0.0
    # The vertical exit below already provides the post-release clearance;
    # avoid a redundant intermediate planner call at the same cup pose.
    post_release_clearance_z_offset: 0.0
    retreat_height: 0.18
    retreat_x: 0.0
    retreat_y: 0.0
    entry_settle_steps: 4
    place_settle_steps: 6
    clearance_settle_steps: 4
    retreat_settle_steps: 2
    require_pre_release_check: true
    pre_release_xy_tolerance: 0.015
    pre_release_z_tolerance: 0.03
    pre_release_upright_threshold_deg: 15.0
    target_max_base_x: 0.60
  cleaning_tool_return_place:
    place_height: 0.0
    retreat_height: 0.14
    retreat_x: -0.06
    retreat_y: -0.06
    post_release_clearance_z_offset: 0.12
    target_max_base_x: 0.56
  handlers:
    dry_run_wipe_semantic_proxy: true
    accessible_place_dry_run_only: true
  pick_proxy:
    dry_run_only: true
    object_max_base_x: 0.66

semantics:
  origin_threshold: 0.02
  tool_return_region_tolerance: 0.02
  moved_threshold: 0.10
  wipe_radius: 0.14
  contact_separation: 0.02
  minimum_contact_count: 2
  minimum_wipe_sweep: 0.08
  release_distance: 0.15
  stain_surface_z_offset: 0.0015
  stain_color_rgba: [0.20, 0.055, 0.01, 0.92]
  # Local coordinates are [along wipe direction, perpendicular direction,
  # radius_x, radius_y, relative_alpha]. Together they form an irregular,
  # cup-sized coffee stain with no contacts or collision geometry.
  stain_spots:
    - [-0.028, -0.003, 0.022, 0.016, 0.72]
    - [-0.015,  0.008, 0.028, 0.019, 0.86]
    - [-0.002, -0.006, 0.030, 0.021, 1.00]
    - [ 0.014,  0.006, 0.027, 0.019, 0.90]
    - [ 0.027, -0.004, 0.020, 0.015, 0.76]

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
