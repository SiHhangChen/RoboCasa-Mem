schema_version: 1

task:
  id: WR-04
  display_name: Return one item to its original shelf level
  description: Stage one sponge beside the sink, normalize transport posture, then return it to its remembered shelf level.
  success_conditions:
    - initial_level_physically_verified
    - item_removed_from_home
    - item_staged_at_fixed_sink
    - memory_barrier_latched
    - first_return_level_correct
    - same_item_returned
    - item_in_original_level
    - item_released
    - no_protocol_violation

scene:
  env_name: WR04ReturnSingleObjectToOriginalLevel
  fixed_scene: true
  layout_id: 32
  style_id: 32
  scene_seed: 0

episode:
  max_horizon: 3200

initial_state:
  robot_base:
    mode: preserve_reset_pose
  home_regions:
    shelf_lower:
      shelf_level: 0
      size: [0.72, 0.13]
      pos: [0.0, -1.0]
      margin: 0.04
    shelf_upper:
      shelf_level: 1
      size: [0.72, 0.13]
      pos: [0.0, -1.0]
      margin: 0.04
  objects: {}

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_observations: true

resources:
  item_shelf_grasp: calibration/shelf_ketchup_grasp.json
  sink_stage_place: calibration/sink_left_place_tcp.json
  planner_script: ../../../execution/planning/mplib_planner.py
  stations: station/stations.json

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.04
  base_yaw_tolerance: 0.08
  base_max_steps: 2000
  base_holding_drop_tolerance: 0.10
  base_profile_v_max: 0.65
  base_profile_a_max: 1.6
  base_profile_a_dec: 1.2
  base_profile_v_min: 0.22
  base_profile_dock_v_max: 0.50
  base_profile_dock_v_min: 0.28
  base_profile_w_max: 1.2
  base_profile_alpha_max: 3.0
  base_profile_alpha_dec: 2.5
  base_profile_w_min: 0.2
  manual_base_path_enabled: false
  base_single_axis_tracking: false
  use_station_astar_paths: false
  station_nav_use_docking: true
  use_station_base_poses: true

manipulation:
  pick_place:
    orientation_mode: object-y-topdown
    pregrasp_height: 0.15
    grasp_clearance: -0.04
    lift_height: 0.12
    place_height: 0.10
    retreat_height: 0.18
    retreat_x: 0.0
    retreat_y: -0.10
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
    preserve_ik_branch_stages: [place]
    nearest_ik_samples: 64
    nearest_ik_threshold: 0.01
    nearest_ik_max_joint_delta: 2.0
  runtime:
    max_joint_step: 0.030
    settle_steps: 8
    position_threshold: 0.02
    orientation_threshold_deg: 15.0
    qpos_threshold: 0.16
    open_steps: 4
    close_steps: 9
    release_steps: 5
    release_settle_steps: 8
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: counter,sink,cabinet
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: pregrasp,grasp,lift,place,clearance,retreat
    min_z: 1.0
    max_points: 4000

operations:
  shelf_pick:
    orientation_mode: side-from-base
    pregrasp_height: 0.08
    close_gripper_action: 1.0
    held_gripper_action: 1.0
    post_close_hold_steps: 30
    grasp_clearance: -0.005
    lift_height: 0.01
    allow_pregrasp_near_miss: true
    allow_grasp_near_miss: true
  item_shelf_pick: {}
  return_pick:
    orientation_mode: object-y-topdown
    pregrasp_height: 0.04
    manual_grasp_pregrasp_distance: 0.04
    lift_height: 0.08
  item_return_pick: {}
  sink_place:
    placement_reference: bbox_bottom_center
    place_height: 0.01
    retreat_height: 0.10
    retreat_x: 0.0
    retreat_y: 0.0
    placement_approach_angles_deg: null
    placement_yaw_offsets_deg: [45.0, 90.0, -45.0, -90.0, 0.0, 180.0]
    placement_object_upright: true
    settle_item_upright: false
    allow_place_near_miss: true
    place_near_miss_max_position_error: 0.06
    manual_place_xy_radius: 0.0
    manual_place_entry_z_offset: 0.08
    manual_place_retreat_z_offset: 0.12
  home_place:
    # Keep the calibrated grasp transform but approach and retreat farther than
    # the 15 cm release-distance success threshold.
    return_retreat_distance: 0.18
    settle_item_upright: true
    position_retry_count: 1
    position_retry_max_error: 0.05
    position_retry_settle_steps: 60
    allow_place_near_miss: true
    place_near_miss_max_position_error: 0.02
    allow_shelf_region_release: false
    semantic_place_if_unreachable: false
  normalize_transport_posture:
    target_height: 0.02
    tolerance: 0.002
    max_steps: 240
    gripper_action: 1.0
    holding_follow_tolerance: 0.05
  return_arm_empty:
    gripper_action: -1.0
  return_arm_holding:
    gripper_action: 1.0
  return_navigation:
    holding_drop_tolerance: 0.18
    tolerance: 0.02
    yaw_tolerance: 0.03
  handlers:
    accessible_place_dry_run_only: true

semantics:
  home_threshold: 0.16
  sink_stage_threshold: 0.20
  return_region_xy_margin: 0.04
  return_region_height_tolerance: 0.10
  release_distance: 0.15

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
