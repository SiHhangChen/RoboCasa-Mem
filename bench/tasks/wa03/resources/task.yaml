# WA-03 production task configuration. Dataset storage options remain CLI-owned.
schema_version: 1

task:
  id: WA-03
  display_name: Identify sugared coffee among three cups
  description: Deliver all three coffees and select the one that received sugar.
  success_conditions:
    - sugar_consumed
    - all_cups_ready_before_selection
    - correct_sugared_selection

scene:
  env_name: WA03SortSugaredAndUnsugaredCoffee
  fixed_scene: true
  layout_id: 29
  style_id: 29
  scene_seed: 0
  sugar_name: sugar_cube

episode:
  sugar_target_mode: unmarked
  delivery_order: null
  max_horizon: 6500

initial_state:
  robot_base:
    mode: manual_path_sample
    sample_index: 0
  objects:
    enabled: true
    coffee_initial_z: 0.97748
    coffee_mug_sliding_friction: 0.95
    coffee_mug_mass_scale: 0.35
    sugar_plate_initial_region_center_xy: [-0.14, -4.76]
    sugar_plate_initial_region_size_xy: [0.0, 0.0]
    canonical_scene_seed: 0
    sugar_plate_initial_z: 0.93172
    sugar_plate_initial_yaw_deg: 0.0
    sugar_cube_initial_z: 0.94582
    sugar_cube_initial_yaw_deg: 0.0

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  cup_place_poses: poses/cup_place.json
  sugar_cube_poses: poses/sugar_cube.json
  station_poses: station/stations.json
  manual_base_path: navigation/manual_base_path_layout29_style29_seed0.json
  planner_script: ../../../execution/planning/mplib_planner.py

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.025
  base_yaw_tolerance: 0.06
  base_max_steps: 1500
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.030
  manual_base_path_yaw_tolerance: 0.06
  base_single_axis_tracking: false
  base_terminal_yaw_distance: 0.05
  base_snap_to_target_after_success: false
  base_profile_v_max: 0.75
  base_profile_a_max: 1.30
  base_profile_a_dec: 1.50
  base_profile_v_min: 0.15
  base_profile_w_max: 0.75
  base_profile_alpha_max: 1.50
  base_profile_alpha_dec: 1.30
  base_profile_w_min: 0.08
  use_station_astar_paths: false
  station_nav_use_docking: false
  station_nav_dock_standoff: 0.0
  station_nav_require_footprint: false
  use_station_base_poses: true

manipulation:
  pick_place:
    orientation_mode: object-y-topdown
    mug_orientation_mode: mug-body-side
    pregrasp_height: 0.20
    grasp_clearance: -0.05
    lift_height: 0.12
    mug_lift_height: 0.035
    grasp_yaw_offset_deg: 0.0
    place_height: 0.16
    retreat_height: 0.30
    retreat_x: -0.10
    retreat_y: -0.18
    release_offset_x: 0.0
    release_offset_y: 0.0
    post_release_clearance_distance: 0.0
    post_release_clearance_z_offset: 0.0
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
  runtime:
    max_joint_step: 0.025
    settle_steps: 10
    position_threshold: 0.12
    orientation_threshold_deg: 15.0
    qpos_threshold: 0.16
    open_steps: 10
    close_steps: 50
    release_steps: 20
    release_settle_steps: 5
  static_scene:
    enabled: true
    validate_collisions: false
    fixture_keywords: cabinet,coffee_machine
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: pregrasp,grasp,lift,place,clearance,retreat
    min_z: 1.0
    max_points: 4000

operations:
  sugar_pick:
    preshape_gripper_steps: 4
    pregrasp_settle_steps: 10
    grasp_settle_steps: 10
    lift_settle_steps: 10
  sugar_delivery:
    entry_settle_steps: 2
    place_settle_steps: 5
    clearance_settle_steps: 2
    retreat_settle_steps: 2
    release_settle_steps: 5
  dining_place:
    entry_settle_steps: 2
    place_settle_steps: 5
    clearance_settle_steps: 2
    retreat_settle_steps: 2
    release_settle_steps: 10
  coffee_transport:
    use_manual_grasp: false
    topdown_pregrasp_height: 0.15
    topdown_grasp_clearance: -0.05
    pregrasp_settle_steps: 10
    grasp_settle_steps: 15
    lift_settle_steps: 5
    mugs:
      coffee_A:
        lift_height: 0.14
        lift_settle_steps: 5
      coffee_B:
        lift_height: 0.08
        lift_settle_steps: 5
      coffee_C:
        lift_height: 0.10
        lift_settle_steps: 5
  final_selection:
    orientation_mode: object-y-topdown
    pregrasp_height: 0.15
    grasp_clearance: -0.05
    lift_height: 0.12
    grasp_yaw_offset_deg: 0.0
    preshape_gripper_steps: 0
    descent_gripper_action: -1.0
    close_gripper_action: 1.0
    held_gripper_action: 1.0
    pregrasp_settle_steps: 10
    grasp_settle_steps: 15
    lift_settle_steps: 5
  return_arm:
    settle_steps: 2
  handlers:
    accept_sugar_delivery: true

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
