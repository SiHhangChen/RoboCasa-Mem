# TM04 contract and physically validated configuration.
schema_version: 1

task:
  id: TM04
  display_name: Fill Pot, Retrieve Can, and Add Two Sugars
  description: Interleave pot filling, can retrieval, and exactly-two-of-three sugar counting.
  canonical_prompt: >-
    First, press the blue water button beside the sink to turn on the faucet and fill
    the pot already in the sink. While the pot fills, complete the first part of each
    other task in either order: retrieve the can from the cabinet and place it in the
    marked area, and add one of the three sugar cubes to the hot chocolate saucepan.
    After the can has been placed and one sugar cube has been added, complete the three
    remaining steps in any order: turn off the faucet with the same blue button, close
    the cabinet door, and add one more sugar cube to the hot chocolate so that exactly
    two cubes are in the saucepan and one remains outside. When the faucet is off, the
    filled pot is stable in the sink, the can is in the marked area, the cabinet is
    closed, and exactly two sugar cubes are in the hot chocolate, press the red
    completion button beside the sink.
  canonical_prompt_sha256: c0e549c8d3582c38874ed520fecc813d89e87331d8e394ad60e87ae024eb85ef
  success_conditions:
    - legal_event_route
    - faucet_on_once
    - faucet_off_once
    - faucet_off
    - pot_filled_and_stable_in_sink
    - can_retrieved_and_released_in_place_region
    - cabinet_closed
    - exact_target_sugar_count
    - third_sugar_outside_saucepan
    - sugars_released
    - completion_button_pressed
    - no_absorbing_failure
    - fixed_prompt

scene:
  env_name: TM04FillPotRetrieveCanAndAddTwoSugars
  fixed_scene: true
  layout_id: 15
  style_id: 34
  scene_seed: 0
  base_task: TM02
  sugar_thread_source: TS03.k2_n3
  water_button_world_xyz: [2.06, -2.56, 0.93]
  completion_button_world_xyz: [2.06, -2.42, 0.93]
  cabinet_world_xyz: [0.32, -3.93, 1.12]
  cabinet_yaw_deg: 90.0
  can_place_region_world_xyz: [2.15, -3.72, 0.925]
  can_place_region_size_xy: [0.22, 0.20]
  water_pot_name: pot
  can_name: can
  sugar_plate_name: sugar_plate
  hot_chocolate_name: hot_chocolate_saucepan
  sugar_names: [sugar0, sugar1, sugar2]
  # Frozen from the 20-step layout-15/style-34 scene probe.
  sugar_plate_world_xyz: [0.4238691631, -2.5346556641, 0.9342305252]
  hot_chocolate_world_xyz: [0.3740112117, -3.3090519567, 1.0148054546]

episode:
  route_balance: seed_modulo_12
  target_sugar_count: 2
  total_sugar_count: 3
  max_horizon: 5200

initial_state:
  robot_base_sample_index: 0
  faucet_mode: off
  pot_in_sink_under_water_site: true
  cabinet_door_open_fraction: 0.0
  can_inside_cabinet: true
  sugar_count_on_plate: 3
  sugar_count_in_saucepan: 0
  settle_steps: 20

semantics:
  cabinet_open_threshold: 0.70
  cabinet_closed_threshold: 0.08
  button_pressed_threshold_m: 0.004
  button_released_threshold_m: 0.001
  button_release_dwell_steps: 3
  can_place_xy_tolerance_m: 0.02
  pot_water_xy_threshold_m: 0.12
  pot_translation_guard_m: 0.04
  pot_tilt_guard_deg: 8.0
  pot_fill_required_steps: 200
  pot_filled_threshold: 0.95
  saucepan_translation_guard_m: 0.010
  saucepan_tilt_guard_deg: 5.0
  saucepan_unstable_dwell_steps: 20
  reject_simultaneous_semantic_events: true
  absorbing_order_failures: true

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  # The inherited water/cabinet/can thread keeps TM02's validated layout-15
  # calibration; TM04 owns its sugar stations and release calibration.
  manual_base_path: navigation/manual_base_path_layout15_style34_seed0.json
  cabinet_station_poses: ../../tm02/resources/calibration/wr01_relative_cabinet_stations.json
  cabinet_door_pose: ../../tm02/resources/calibration/wr01_relative_lower_door_grasp.json
  can_grasp_pose: ../../tm02/resources/calibration/can_side_grasp.json
  can_retrieval_prepose: ../../tm02/resources/calibration/wr01_relative_lower_retrieval_prepose.json
  can_place_pose: calibration/can_place_region_release.json
  sugar_pick_poses: calibration/sugar_pick_poses.json
  sugar_delivery_poses: calibration/sugar_delivery_poses.json
  sugar_scene_placements: scene/sugar_placements.json
  planner_script: ../../../execution/planning/mplib_planner.py

navigation:
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.12
  manual_base_path_yaw_tolerance: 0.16
  use_station_base_poses: false
  use_station_astar_paths: false

manipulation:
  pick_place:
    orientation_mode: object-y-topdown
    pregrasp_height: 0.15
    grasp_clearance: -0.038
    lift_height: 0.24
    place_height: 0.07
    retreat_height: 0.24
    retreat_x: -0.10
    retreat_y: -0.18
  planner:
    conda_env: membench
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
  runtime:
    max_joint_step: 0.025
    settle_steps: 20
    position_threshold: 0.08
    orientation_threshold_deg: 15.0
    qpos_threshold: 0.50
    open_steps: 20
    close_steps: 90
    release_steps: 40
    release_settle_steps: 20
  static_scene:
    enabled: false
    validate_collisions: false

operations:
  water_button:
    mode: physical_button
    prepress_z_offset: 0.08
    press_z_offset: -0.010
    hold_steps: 12
    gripper_action: 1.0
    near_miss_position_tolerance: 0.09
    require_physical_button_motion: true
  cabinet_open:
    control_mode: physical_handle
    opened_threshold: 0.70
    pregrasp_distance: 0.14
    retreat_distance: 0.10
    open_distances: [0.03, 0.12, 0.21, 0.34]
    close_deltas: [0.12, 0.27, 0.36, 0.44]
    gripper_open_steps: 7
    gripper_close_steps: 15
    gripper_release_steps: 10
    motion_settle_steps: 2
    final_motion_settle_steps: 5
    retreat_settle_steps: 5
  can_pick:
    mode: cabinet_front_corridor
    require_physical_grasp: true
    front_clearance_distance: 0.10
    front_pregrasp_distance: 0.10
    front_clearance_z_offset: 0.10
    grasp_z_offset: 0.010
    grasp_lateral_offset: -0.0067
    grasp_inward_offset: 0.0042
    close_gripper_steps: 6
    post_close_hold_steps: 12
    held_gripper_action: 1.0
    disable_collisions_during_transport: false
  can_place:
    require_release: true
    target_region: can_place_region
  cabinet_close:
    control_mode: physical_handle
    closed_threshold: 0.08
    max_physical_attempts: 2
    pregrasp_distance: 0.14
    retreat_distance: 0.10
    open_distances: [0.03, 0.12, 0.21, 0.34]
    close_deltas: [0.12, 0.27, 0.36, 0.44]
    gripper_open_steps: 7
    gripper_close_steps: 15
    gripper_release_steps: 10
    motion_settle_steps: 2
    final_motion_settle_steps: 5
    retreat_settle_steps: 5
  sugar_pick:
    require_physical_grasp: true
    orientation_mode: object-y-topdown
    pregrasp_height: 0.15
    grasp_clearance: -0.038
    lift_height: 0.24
    close_gripper_action: 1.0
    held_gripper_action: 1.0
  sugar_delivery:
    require_release: true
    target_receptacle: hot_chocolate_saucepan
    placement_yaw_offsets_deg: [0.0, 90.0, 180.0, 270.0]
    release_offsets_xy:
      - [-0.020, 0.000]
      - [0.020, 0.000]
      - [0.000, -0.020]
      - [0.000, 0.020]
      - [0.000, 0.000]
    release_target_max_radius_m: 0.045
    place_height: 0.07
    retreat_height: 0.24
    retreat_x: -0.10
    retreat_y: -0.18
  completion_button:
    prepress_z_offset: 0.08
    press_z_offset: -0.010
    hold_steps: 12
    gripper_action: 1.0
    near_miss_position_tolerance: 0.09
    minimum_press_displacement_m: 0.004
    require_physical_button_motion: true
  return_arm:
    settle_steps: 20

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
