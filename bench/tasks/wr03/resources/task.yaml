schema_version: 1

task:
  id: WR-03
  display_name: Store and retrieve remembered can
  description: Observe the pre-filled open cabinet, close both doors in either order, then retrieve the can from memory and release it on the table.
  success_conditions:
    - can_storage_verified
    - both_doors_closed_after_storage
    - memory_barrier_latched
    - correct_retrieval_door
    - same_can_retrieved
    - can_outside_both_cabinets
    - no_protocol_violation

scene:
  env_name: WR03StoreAndRetrieveRememberedCan
  fixed_scene: true
  layout_id: 24
  style_id: 24
  scene_seed: 0

episode:
  stored_level: null
  # Recording plan only; policy evaluation accepts either door order.
  close_order: null
  max_horizon: 8000

initial_state:
  robot_base:
    mode: explicit_pose
    # Start at the sampled table/item station. The cabinet-front canonical
    # circle is used later for pre-close staging and the memory handoff.
    xy: [5.216, -1.055]
    yaw: 1.571
    # Sample the initial table station inside a 10 cm diameter disk.
    sampling_radius_m: 0.05
  robot_torso:
    height_m: 0.20
  cabinets:
    world_xyz: [3.3599999, -0.3500018, 1.1363333]
    yaw_deg: 0.0
    upper_z_offset: 0.40
    doors_initially_open: true
    open_fraction: 0.82
  objects:
    object_scale: 0.90

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  planner_script: ../../../execution/planning/mplib_planner.py
  lower_retrieval_prepose: calibration/lower_retrieval_prepose.json
  lower_door_grasp_pose: calibration/lower_door_grasp.json
  upper_door_grasp_pose: calibration/upper_door_grasp.json
  stations: station/stations.json
  manual_base_path: navigation/manual_base_path_layout24_style24_seed0.json

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.04
  base_yaw_tolerance: 0.08
  base_max_steps: 1500
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.04
  manual_base_path_yaw_tolerance: 0.08
  # Carrying motion is acceleration-limited so the physical finger contacts,
  # rather than an attachment, retain the can during base transport.
  base_profile_v_max: 0.75
  base_profile_a_max: 1.30
  base_profile_a_dec: 1.50
  base_profile_v_min: 0.15
  base_profile_w_max: 0.75
  base_profile_alpha_max: 1.50
  base_profile_alpha_dec: 1.30
  base_profile_w_min: 0.08
  use_station_astar_paths: false
  station_nav_use_docking: false
  station_nav_dock_standoff: 0.0
  station_nav_require_footprint: false

manipulation:
  gripper:
    # Use the Panda gripper asset's rated per-finger force limit.
    force_limit: 20.0
    # Physical contact parameters for the rubber-coated finger contact surfaces.
    # No attachment or collision masking is used; the can remains a free body.
    pad_friction: [2.0, 0.05, 0.0001]
  pick_place:
    orientation_mode: object-y-topdown
    mug_orientation_mode: mug-body-side
    pregrasp_height: 0.15
    grasp_clearance: -0.04
    lift_height: 0.12
    place_height: 0.10
    retreat_height: 0.18
    retreat_x: 0.0
    retreat_y: -0.10
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 7.0
    time_step: 0.1
    qpos_step: 0.020
    rrt_range: 0.08
  runtime:
    max_joint_step: 0.030
    settle_steps: 10
    position_threshold: 0.05
    orientation_threshold_deg: 12.0
    qpos_threshold: 0.24
    open_steps: 10
    # PandaGripper integrates binary commands by 0.2 per control step. Starting
    # fully open therefore needs 10 positive steps to reach the closed target.
    close_steps: 10
    release_steps: 10
    release_settle_steps: 4
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: cabinet,counter,stove
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: pregrasp,grasp,lift,place,clearance,retreat
    min_z: 1.0
    max_points: 4000

operations:
  storage_pick:
    manual_grasp_pregrasp_distance: 0.075
    lift_height: 0.025
    post_close_hold_steps: 8
    held_gripper_action: 0.0
  storage_place:
    insertion_plan_attempts: 3
    release_settle_steps: 4
  retrieval_pick:
    mode: cabinet_front_corridor
    front_clearance_distance: 0.10
    front_pregrasp_distance: 0.10
    front_clearance_z_offset: 0.10
    grasp_z_offset: 0.010
    grasp_lateral_offset: -0.0067
    grasp_inward_offset: 0.0042
    close_gripper_steps: 10
    post_close_hold_steps: 12
    held_gripper_action: 0.0
  door:
    open_fraction: 1.0
    opened_threshold: 0.70
    closed_threshold: 0.08
    control_mode: physical_handle
    pregrasp_distance: 0.14
    retreat_distance: 0.10
    open_distances: [0.03, 0.12, 0.21, 0.34]
    close_deltas: [0.12, 0.27, 0.36, 0.44]
    gripper_open_steps: 7
    gripper_close_steps: 15
    gripper_release_steps: 10
    motion_settle_steps: 2
    final_motion_settle_steps: 5
    retreat_settle_steps: 5
  return_arm:
    settle_steps: 2

semantics:
  cabinet_contains_margin: 0.04
  final_closed_threshold: 0.08
  physical_event_dwell_steps: 3

recording:
  record_depth: false
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
