schema_version: 1

task:
  id: WR-05
  display_name: Return ketchup and mustard from the plate
  description: Bring the ketchup and mustard bottles to the serving plate, then restore their remembered shelf levels.
  success_conditions:
    - ketchup_staged_at_plate
    - mustard_staged_at_plate
    - condiments_in_return_shelf
    - condiment_shelf_level_relation_correct
    - condiments_released

scene:
  env_name: WR05ReturnCondimentPair
  fixed_scene: true
  layout_id: 32
  style_id: 32
  scene_seed: 0

episode:
  transport_order: [ketchup, mustard]
  return_place_xy_half_extents: [0.2, 0.03]
  return_level_min_separation: 0.20
  return_nominal_level_separation: 0.2966666666666667
  max_horizon: 5000

initial_state:
  robot_base:
    mode: preserve_reset_pose
  home_regions:
    shelf_lower:
      shelf_level: 0
      size: [0.72, 0.13]
      pos: [0.0, -1.0]
      margin: 0.04
    shelf_upper:
      shelf_level: 1
      size: [0.72, 0.13]
      pos: [0.0, -1.0]
      margin: 0.04
  objects: {}

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_observations: true

resources:
  ketchup_shelf_grasp: calibration/shelf_ketchup_grasp.json
  mustard_shelf_grasp: calibration/shelf_mustard_grasp.json
  plate_ketchup_return_grasp: calibration/plate_ketchup_return_grasp.json
  plate_mustard_return_grasp: calibration/plate_mustard_return_grasp.json
  planner_script: ../../../execution/planning/mplib_planner.py
  stations: calibration/stations.json

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.04
  base_yaw_tolerance: 0.08
  base_max_steps: 2000
  base_holding_drop_tolerance: 0.10
  base_profile_v_max: 0.65
  base_profile_a_max: 1.6
  base_profile_a_dec: 1.2
  base_profile_v_min: 0.22
  base_profile_dock_v_max: 0.50
  base_profile_dock_v_min: 0.28
  base_profile_w_max: 1.2
  base_profile_alpha_max: 3.0
  base_profile_alpha_dec: 2.5
  base_profile_w_min: 0.2
  manual_base_path_enabled: false
  base_single_axis_tracking: false
  use_station_astar_paths: false
  station_nav_use_docking: true
  use_station_base_poses: true

manipulation:
  pick_place:
    orientation_mode: object-y-topdown
    mug_orientation_mode: mug-body-side
    pregrasp_height: 0.15
    grasp_clearance: -0.04
    lift_height: 0.12
    place_height: 0.10
    retreat_height: 0.18
    retreat_x: 0.0
    retreat_y: -0.10
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
    preserve_ik_branch_stages: [place]
    nearest_ik_samples: 64
    nearest_ik_threshold: 0.01
    nearest_ik_max_joint_delta: 2.15
  runtime:
    max_joint_step: 0.030
    settle_steps: 8
    position_threshold: 0.02
    orientation_threshold_deg: 15.0
    qpos_threshold: 0.16
    open_steps: 4
    close_steps: 9
    release_steps: 5
    release_settle_steps: 8
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: counter,sink,cabinet
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: pregrasp,grasp,lift,place,clearance,retreat
    min_z: 1.0
    max_points: 4000

operations:
  shelf_pick:
    orientation_mode: side-from-base
    pregrasp_height: 0.08
    close_gripper_action: 1.0
    held_gripper_action: 1.0
    post_close_hold_steps: 30
    grasp_clearance: -0.005
    lift_height: 0.01
    allow_pregrasp_near_miss: true
    allow_grasp_near_miss: true
  ketchup_shelf_pick: {}
  mustard_shelf_pick:
    lift_height: 0.01
  return_pick:
    orientation_mode: object-y-topdown
    pregrasp_height: 0.04
    manual_grasp_pregrasp_distance: 0.04
    lift_height: 0.08
  ketchup_return_pick:
    # Plate re-pick follows WA-02's low-table side grasp: build mug-body-side
    # candidates at several yaw offsets, dry-run each full chain, execute the
    # shortest reachable candidate.  The -90 deg candidate is excluded by the
    # selector because it approaches the bottle across the plate.
    grasp_near_miss_max_position_error: 0.05
    orientation_mode: mug-body-side
    pregrasp_height: 0.18
    grasp_clearance: -0.02
    grasp_offset_z: -0.055
    lift_height: 0.12
    plate_side_grasp_yaw_offsets_deg: [0.0, -45.0, 45.0, 90.0]
    retreat_to_pregrasp_after_grasp: false
  mustard_return_pick:
    # The reachable 45-degree side approach can stop about 10 cm short in EEF
    # position while the fingers already straddle and contact the wide mustard
    # bottle.  Permit the physical close attempt; contact + lift validation
    # below the shared pick controller remains authoritative.
    grasp_near_miss_max_position_error: 0.11
    pregrasp_settle_steps: 30
    grasp_settle_steps: 60
    lift_settle_steps: 30
    orientation_mode: mug-body-side
    pregrasp_height: 0.18
    grasp_clearance: -0.02
    # The realized Panda TCP settles about 7 cm above the planned target at
    # this plate station.  Aim lower so the physical fingers close around the
    # mustard body instead of catching its top rim.
    grasp_offset_z: -0.055
    lift_height: 0.12
    plate_side_grasp_yaw_offsets_deg: [0.0, -45.0, 45.0, 90.0]
    retreat_to_pregrasp_after_grasp: false
  plate_place:
    # Reuse WA-02's object-upright placement contract: preserve the calibrated
    # EEF-to-bottle grasp transform, rotate the bottle's local +Z onto world +Z,
    # and only then descend to the plate-side target.  No yaw offsets: they
    # tipped the bottles in earlier runs.
    placement_reference: bbox_bottom_center
    placement_object_upright: true
    # Stop 20 mm above the nominal support plane. The bottle collision geometry
    # establishes support below its visual bbox bottom, so even a -1 cm target
    # still produced about 16 mm of visible penetration. The release anchor
    # corrects this small positive gap onto the tabletop before retreat.
    place_height: 0.02
    retreat_height: 0.14
    retreat_x: 0.0
    retreat_y: 0.0
    # After opening at the place pose, lift vertically to a high clearance pose
    # before translating away, so the retreat cannot brush the new bottle.
    placement_entry_z_offset: 0.12
    post_release_clearance_distance: 0.0
    post_release_clearance_z_offset: 0.22
    placement_exit_z_offset: 0.22
    placement_entry_standoff: 0.10
    placement_exit_standoff: 0.08
    placement_approach_angles_deg: [30.0, 90.0, 60.0, 120.0, 150.0, 0.0, 180.0]
    entry_settle_steps: 20
    place_settle_steps: 20
    # End the descending trajectory as soon as the bottle bottom enters a
    # 5 mm support guard above the tabletop.
    place_descent_stop_bottom_offset: 0.005
    release_steps: 35
    release_settle_steps: 10
    # Release is solved only by the gripper/table contact dynamics.
    release_separation_assist_distance: 0.0
    release_anchor_align_support: false
    clearance_settle_steps: 20
    retreat_settle_steps: 8
    # Reachability: the raw plate-side target can exceed the arm's forward
    # reach from the plate station.  Apply the accessible-object adjustment
    # only for plate staging (shelf-return place keeps the default true).
    dry_run_only: false
    require_pre_release_support: true
    pre_release_bottom_min_offset: -0.01
    pre_release_bottom_max_offset: 0.015
    # Keep a 5 cm margin inside the task's 20 cm plate-stage predicate while
    # avoiding millimetre-scale rejection at the old 14 cm boundary.
    pre_release_xy_tolerance: 0.15
    pre_release_upright_tolerance_deg: 15.0
    allow_place_near_miss: true
    # A support-guard stop intentionally does not reach the below-table IK
    # target.  Accept that early stop, then let the physical pre-release gate
    # decide whether opening is safe.
    allow_place_trajectory_early_stop: true
    place_near_miss_max_position_error: 0.13
    allow_place_qpos_near_miss: true
    place_near_miss_max_qpos_error: 0.24
  home_place:
    # Preserve the effective WR-05 configuration inherited from WR-02 in the
    # source repository. The canonical handler consumes the legacy-only keys
    # locally instead of forwarding them into the shared controller.
    settle_condiment_upright: true
    position_retry_count: 1
    position_retry_max_error: 0.05
    position_retry_settle_steps: 60
    allow_place_near_miss: true
    # The Cartesian retry contract already accepts tracking residuals up to
    # 5 cm.  Use that same bound for entering the physical release gate; the
    # bottle is still opened only if the independent bottom/XY/upright support
    # checks below all pass.
    place_near_miss_max_position_error: 0.05
    # Stop the commanded descent before shelf contact can lever the bottle out
    # of the gripper.  Release remains gated by the live support checks below.
    place_descent_stop_bottom_offset: 0.005
    allow_place_trajectory_early_stop: true
    allow_shelf_region_release: false
    semantic_place_if_unreachable: false
    # Real bottles are already upright in the model frame; the return target
    # keeps the identity quaternion instead of a long-edge rotation.
    upright_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    # Verify that the live bottle bottom is at its remembered shelf support,
    # then open slowly enough for gravity and shelf contact to settle it.
    require_pre_release_support: true
    pre_release_bottom_min_offset: -0.015
    pre_release_bottom_max_offset: 0.015
    pre_release_xy_tolerance: 0.06
    pre_release_upright_tolerance_deg: 15.0
    release_steps: 45
    release_settle_steps: 15
    # Do not use the plate-release anchor here: pinning through the horizontal
    # retreat makes a fully released shelf bottle appear to hover in mid-air.
    release_separation_assist_distance: 0.0
    release_anchor_align_support: false
  ketchup_home_place:
    object_relative_place_grasp_pose_file: null
    placement_reference: object_origin
    placement_object_upright: true
    place_height: 0.0
    retreat_height: 0.12
    retreat_x: 0.0
    retreat_y: 0.0
    placement_approach_angles_deg: [-90.0, -60.0, -120.0]
    placement_entry_standoff: 0.08
    placement_exit_standoff: 0.08
    placement_entry_z_offset: 0.05
    placement_exit_z_offset: 0.05
  mustard_home_place:
    # The plate selector may choose a different side-grasp yaw on each run.
    # The shelf placement builds its target from the live EEF-to-object
    # attachment instead of a fixed shelf-grasp file.
    object_relative_place_grasp_pose_file: null
    placement_reference: object_origin
    placement_object_upright: true
    place_height: 0.0
    retreat_height: 0.12
    retreat_x: 0.0
    retreat_y: 0.0
    placement_approach_angles_deg: [-90.0, -60.0, -120.0]
    placement_entry_standoff: 0.08
    placement_exit_standoff: 0.08
    placement_entry_z_offset: 0.05
    placement_exit_z_offset: 0.05
  lower_torso_after_upper_pick:
    target_height: 0.02
    tolerance: 0.002
    max_steps: 240
    gripper_action: 1.0
    holding_follow_tolerance: 0.05
  return_arm_empty:
    gripper_action: -1.0
  return_arm_holding:
    gripper_action: 1.0
  return_navigation:
    holding_drop_tolerance: 0.18
    tolerance: 0.02
    yaw_tolerance: 0.03
  handlers:
    accessible_place_dry_run_only: true

semantics:
  home_threshold: 0.16
  plate_stage_threshold: 0.20
  return_region_xy_margin: 0.04
  return_region_height_tolerance: 0.10
  return_level_min_separation: 0.20
  release_distance: 0.15

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
