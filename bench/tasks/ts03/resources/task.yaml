# TS-03 production configuration. Dataset storage flags remain task-owned here;
# output paths and episode selection remain recorder-owned.
schema_version: 1

task:
  id: TS-03
  display_name: Hierarchical Add K Sugar To Hot Chocolate
  description: Complete one of six separately reported K/N sugar-count profiles, then press the completion button.
  success_conditions:
    - exact_target_sugar_count
    - no_extra_sugar_added
    - sugars_released
    - completion_button_pressed

scene:
  env_name: TS03HierarchicalAddKSugarToHotChocolate
  fixed_scene: true
  layout_id: 39
  style_id: 37
  scene_seed: 0
  sugar_plate_name: sugar_plate
  receptacle_name: saucepan
  sugar_cube_scale: 1.2
  sugar_plate_scale: [0.85, 0.85, 0.8]
  sugar_plate_reference_offset: -1.0
  sugar_plate_placement_size: [0.36, 0.32]
  sugar_burner_id: front_left
  liquid_rgba: [0.58, 0.37, 0.24, 0.92]

episode:
  target_sugar_count: null
  total_sugar_count: null
  max_total_sugar_count: 3
  sugar_name_prefix: sugar
  target_sugar_names: null
  # Three post-pick carrying-pose returns plus the final navigation and physical
  # button press add control steps to a K=3 episode.
  max_horizon: 2800
  saucepan_type_candidates: [Saucepan002]
  saucepan_material_candidates: [original, steel, dark_metal, copper]
  sugar_plate_material_candidates: [original, ceramic_white, ceramic_blue, ceramic_green, metal]
  sugar_cube_material_candidates: [original, sugar_white, sugar_cream, sugar_pink, sugar_blue]

initial_state:
  robot_base:
    mode: preserve_reset_pose
  objects:
    enabled: true
    sugar_plate_edge_margin: 0.012
    # Uniform disk sampling around slot centers: 1 cm diameter, full world yaw.
    sugar_plate_sampling_radius_m: 0.005
    sugar_cube_yaw_half_range_deg: 180.0
    sugar_cube_sliding_friction: 1.0
    sugar_cube_mass_scale: 1.0

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  manual_base_path: navigation/manual_base_path_layout39_style37_seed0.json
  station_poses: navigation/stations.json
  completion_button_position: poses/completion_button_position_layout39_style37_seed0.json

navigation:
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.12
  base_waypoint_tolerance: 0.10
  base_yaw_tolerance: 0.10
  base_max_steps: 1600
  manual_base_path_enabled: false
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.08
  manual_base_path_yaw_tolerance: 0.08
  manual_base_path_segment_yaw_threshold: 0.12
  manual_base_path_max_rotate_steps: 350
  manual_base_path_max_translate_steps: 900
  manual_base_path_xy_gain: 1.2
  manual_base_path_yaw_gain: 0.8
  manual_base_path_nearest_yaw_weight: 0.20
  manual_base_path_rotate_xy_tolerance: 0.10
  base_velocity_profile_enabled: true
  base_profile_v_max: 0.65
  base_profile_a_max: 1.6
  base_profile_a_dec: 1.2
  base_profile_v_min: 0.22
  base_profile_w_max: 1.2
  base_profile_alpha_max: 3.0
  base_profile_alpha_dec: 2.5
  base_profile_w_min: 0.20
  base_profile_dock_v_max: 0.50
  base_profile_dock_v_min: 0.28
  base_lookahead_distance: 0.35
  base_heading_tolerance: 0.35
  base_terminal_yaw_distance: 0.30
  base_terminal_heading_tolerance: 0.20
  base_terminal_translation_gain_scale: 0.5
  base_terminal_translation_min_action: 0.30
  base_terminal_translation_max_action: 0.55
  base_single_axis_tracking: false
  base_terminal_dock_enabled: true
  base_terminal_dock_standoff: 0.35
  base_footprint_half_x: 0.35
  base_footprint_half_y: 0.25
  base_footprint_center_offset_x: -0.20
  base_footprint_center_offset_y: 0.0
  base_footprint_safety_margin: 0.0
  base_stuck_window: 60
  base_stuck_progress: 0.015
  base_abort_on_stuck: true
  base_snap_to_target_after_success: false
  base_trace_stride: 10
  base_candidate_mode: single
  base_candidate_offsets: ""
  base_candidate_step: 0.08
  base_candidate_range_x_values: "0.28,0.36,0.44"
  base_candidate_range_y_values: "-0.16,-0.08,0.00,0.08,0.16"
  base_candidate_yaw_mode: current_and_anchor_sweep
  base_candidate_yaw_offsets_deg: "-35,-20,0,20,35"
  base_candidate_max_count: 9
  base_candidate_workspace_margin: 0.08
  base_candidate_score_static_scene: true
  base_retry_max_attempts: 1
  base_candidate_dry_run_entry_stage: true
  validate_base_path_collisions: false
  base_path_fixture_keywords: cabinet
  base_path_exclude_keywords: floor,wall
  abort_on_base_path_collision: true
  base_holding_drop_tolerance: 0.04
  use_station_astar_paths: false
  station_nav_grid_resolution: 0.04
  station_nav_grid_inflation: 0.35
  station_nav_grid_margin: 1.0
  station_nav_use_docking: false
  station_nav_dock_standoff: 0.30
  station_nav_require_footprint: false
  station_nav_allow_endpoint_snap: true
  station_nav_endpoint_snap_radius: 0.60
  use_station_base_poses: true

manipulation:
  pick_place:
    orientation_mode: object-y-topdown
    mug_orientation_mode: object-y-topdown
    pregrasp_height: 0.15
    grasp_clearance: -0.038
    lift_height: 0.24
    mug_lift_height: null
    grasp_yaw_offset_deg: 0.0
    place_height: 0.07
    retreat_height: 0.24
    retreat_x: -0.10
    retreat_y: -0.18
    release_offset_x: 0.0
    release_offset_y: 0.0
    post_release_clearance_distance: 0.0
    post_release_clearance_z_offset: 0.0
  planner:
    # Recording and MPLib planning share the canonical RoboCasa environment.
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
    # If screw planning fails, sample multiple IK branches and plan to the
    # solution closest to the regular carrying configuration.
    preserve_ik_branch_stages: [place]
    nearest_ik_samples: 64
    nearest_ik_threshold: 0.01
    nearest_ik_max_joint_delta: 2.0
  runtime:
    max_joint_step: 0.025
    settle_steps: 40
    position_threshold: 0.04
    orientation_threshold_deg: 10.0
    qpos_threshold: 0.50
    open_steps: 10
    # The fingers reach the sugar in a few steps and then hold at the 5 N force
    # cap, so closing longer only adds wall time.
    close_steps: 20
    release_steps: 20
    release_settle_steps: 10
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: cabinet
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: pregrasp,grasp,lift,place,clearance,retreat
    min_z: 1.0
    max_points: 4000

operations:
  sugar_pick:
    orientation_mode: object-y-topdown
    pregrasp_height: 0.15
    # Compensate the stable Panda model-to-RoboCasa TCP Z offset observed in
    # physical execution so the fingers close around the cube, not above it.
    grasp_clearance: -0.038
    lift_height: 0.24
    preshape_gripper_steps: 5
    align_preshape_finger_center: true
    descent_gripper_action: 0.0
    close_gripper_action: 1.0
    held_gripper_action: 1.0
    grasp_yaw_offsets_deg: [0.0, 90.0, 180.0, 270.0]
    # Finger-pad center compensation in gripper-local frame (after yaw rotation).
    # X is along finger separation. Positive value shifts TCP so the pads' midpoint
    # moves relative to bbox center. Typical starting values: ±0.005 ~ ±0.012 m.
    # Use to fix "planning put TCP at bbox center but fingers are asymmetric".
    # grasp_finger_offset_x: 0.009   # example: push TCP so left pad moves outward
    # grasp_finger_offset_y: 0.0
    allow_pregrasp_near_miss: true
    allow_grasp_near_miss: true
    # Let the arm controller converge at the pregrasp pose before descending.
    pregrasp_settle_steps: 10
    grasp_settle_steps: 8
    lift_settle_steps: 5
  sugar_delivery:
    place_height: 0.07
    retreat_height: 0.24
    retreat_x: -0.10
    retreat_y: -0.18
    allow_place_near_miss: true
    place_near_miss_max_position_error: 0.18
    entry_settle_steps: 0
    # Let the joint-position controller converge at the selected release pose
    # before evaluating the saucepan guard and opening the gripper.
    place_settle_steps: 10
    clearance_settle_steps: 0
    retreat_settle_steps: 0
    release_settle_steps: 0
    # A sugar independently samples one primary region per episode. Every
    # point/yaw candidate in that region is planned; later regions are fallback.
    placement_yaw_offsets_deg: [0.0, 90.0, 180.0, 270.0]
    release_target_max_radius_m: 0.060
    saucepan_translation_guard_m: 0.010
    saucepan_tilt_guard_deg: 5.0
    validate_collisions: true
    collision_fixture_keywords: stove
    protected_object_names: [saucepan]
    # The held sugar may enter the stove/pan volume; robot links may not.
    holding_allowed_fixture_keywords: stove
  completion_button:
    # Same top-down press geometry used by WA02's physical water buttons.
    prepress_z_offset: 0.08
    press_z_offset: -0.010
    hold_steps: 12
    gripper_action: 1.0
    near_miss_position_tolerance: 0.09
    # The spring-loaded joint has 12 mm of travel; require a real 4 mm press.
    minimum_press_displacement_m: 0.004
  return_arm:
    settle_steps: 20
    gripper_action: -1.0
  handlers:
    accept_sugar_delivery: true
    # Grasp the sugar with a reduced fingertip force (5 N vs the default 20 N)
    # so the cube does not stick to the finger pads on release, then restore
    # the default force for the completion-button press. Same calibration as
    # WA01's sugar pick.
    sugar_gripper_force_limit: 5.0
    default_gripper_force_limit: 20.0

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
