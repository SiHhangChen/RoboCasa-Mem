# TS02 production configuration. Output paths and dataset selection stay CLI-owned.
schema_version: 1

task:
  id: TS02
  display_name: Find the Red Cube and Report Search Length
  description: Search three drawers for a bright red cube, close every inspected drawer, then press the completion button once per inspected drawer.
  success_conditions:
    - target_found
    - search_stopped_at_target
    - at_least_one_fixture_checked
    - no_duplicate_completion
    - no_active_fixture
    - all_fixtures_closed
    - no_invalid_open
    - no_invalid_inspect
    - no_invalid_close
    - no_duplicate_check
    - no_close_before_inspect
    - no_search_after_target
    - completion_button_pressed
    - completion_button_count_matches_search_count
    - no_invalid_completion_button_press

scene:
  env_name: TS02InspectThreeCabinets
  fixed_scene: true
  layout_id: 24
  style_id: 24
  scene_seed: 0
  fixture_names: [cabinet_slot_0, cabinet_slot_1, cabinet_slot_2]
  drawer_world_xyzs:
    - [4.60, -2.37, 1.1363333333333332]
    - [4.85, -2.37, 1.1363333333333332]
    - [5.10, -2.37, 1.1363333333333332]
  drawer_world_yaw_deg: 180.0
  # WA02-style spring-loaded green button on the front edge of the tabletop,
  # kept at the right side of the compact drawer group.
  completion_button_world_xyz: [3.85, -2.06, 0.92]
  open_threshold: 0.70
  closed_threshold: 0.08

episode:
  # Leave demo_fixture_order unset so each dataset seed deterministically
  # samples one permutation of the three cabinets. The sampled order is expert
  # policy metadata, never a target-order success condition.
  # target_fixture is intentionally unset. It is sampled from a separate RNG
  # stream so the expert order cannot leak the red cube's hidden location.
  max_horizon: 2200
  # Cabinet-and-drawer appearance only. Handle and physics stay fixed.
  drawer_material_candidates:
    - wood/light_wood_planks
    - wood/walnut_wood_grain
    - wood/gray_wood_grain
    - wood/bamboo
    - flat/white
    - flat/blue_gray
    - flat/green
    - steel-brushed
  # Intrinsic tool-frame XYZ rotations relative to the calibrated prehook.
  # Hook and pull orientations are unchanged.
  prehook_rotation_candidates_deg:
    baseline: [0.0, 0.0, 0.0]
    pitch_minus_5: [0.0, -5.0, 0.0]
    pitch_plus_3: [0.0, 3.0, 0.0]
  handle_side_offset_half_range_m: 0.015

initial_state:
  robot_base:
    mode: manual_path_sample
    sample_index: 0
  drawers:
    enabled: true
    closed_fraction: 0.0

sensors:
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
  wrist_rgb_camera: robot0_eye_in_hand
  width: 224
  height: 224
  depth: true
  use_camera_observations: true
  has_renderer: false
  has_offscreen_renderer: true

resources:
  station_poses: station/stations.json
  manual_base_path: navigation/manual_base_path_layout24_style24_seed0.json
  planner_script: ../../../execution/planning/mplib_planner.py
  drawer_grasp_pose: poses/cabinet_slot_1_hook_pose.json

navigation:
  # The calibrated station poses are navigation goals. The shared Base driver
  # reaches them with controller actions; it must never teleport during an
  # episode.
  kinematic_base_navigation: false
  base_action_frame: world
  base_translation_action_sign: 1.0
  base_tolerance: 0.025
  base_yaw_tolerance: 0.06
  base_max_steps: 1500
  # The first request follows the calibrated start/forward/turn route to the
  # shared compact-drawer station; repeated drawer checks reuse that station.
  manual_base_path_enabled: true
  manual_base_path_start_index: 0
  manual_base_path_xy_tolerance: 0.030
  manual_base_path_yaw_tolerance: 0.06
  base_single_axis_tracking: false
  base_terminal_yaw_distance: 0.05
  base_snap_to_target_after_success: false
  base_velocity_profile_enabled: true
  base_profile_v_max: 0.75
  base_profile_a_max: 1.30
  base_profile_a_dec: 1.50
  base_profile_v_min: 0.15
  base_profile_w_max: 0.75
  base_profile_alpha_max: 1.50
  base_profile_alpha_dec: 1.30
  base_profile_w_min: 0.08
  use_station_astar_paths: false
  station_nav_use_docking: false
  station_nav_require_footprint: false
  use_station_base_poses: true

manipulation:
  pick_place: {}
  planner:
    conda_env: membench
    subprocess_timeout_s: 60.0
    planning_time: 5.0
    time_step: 0.1
    qpos_step: 0.02
    rrt_range: 0.1
  runtime:
    # Match TS04's conservative accelerated drawer profile. The faster
    # 0.035 / 8 profile can leave drawers insufficiently seated before the
    # robot navigates to the completion button.
    max_joint_step: 0.025
    settle_steps: 10
    position_threshold: 0.10
    orientation_threshold_deg: 20.0
    qpos_threshold: 0.18
    open_steps: 20
    close_steps: 30
    release_steps: 10
    release_settle_steps: 20
  static_scene:
    enabled: false
    validate_collisions: false
    fixture_keywords: cabinet
    exclude_keywords: floor,wall
    spacing: 0.04
    inflate: 0.05
    point_radius: 0.01
    faces: bottom
    point_cloud_stages: prehook,hook,pull,push
    min_z: 0.70
    max_points: 4000

operations:
  drawer_open:
    actuation_mode: contact
    open_fraction: 1.0
    enforce_proximity: true
    # Include the 7.5 cm station radius and 3 cm navigation tolerance.
    max_base_distance: 1.15
    hook_orientation_blend: 0.90
    handle_side_offset: 0.0
    handle_vertical_offset: 0.0
    prehook_distance: 0.125
    hook_offset: 0.005
    # Keep margin above the 0.70 open threshold across the full 15 cm base disk.
    pull_distance: 0.20
    open_fraction_threshold: 0.70
    gripper_steps: 25
    grasp_pose_resource: drawer_grasp_pose
    close_gripper_on_hook: true
    close_gripper_action: 1.0
    close_gripper_steps: 25
  inspect:
    dwell_steps: 0
  drawer_close:
    actuation_mode: contact
    closed_fraction: 0.0
    close_overshoot: 0.005
    closed_fraction_threshold: 0.08
    return_arm_after_close: false
  completion_button:
    # Same approach offsets and hold behavior as the proven WA02 button.
    prepress_z_offset: 0.08
    press_z_offset: -0.010
    hold_steps: 12
    gripper_action: 1.0
    near_miss_position_tolerance: 0.09
    # The plunger has 12 mm of travel; require at least 4 mm of measured motion.
    press_depth_threshold: 0.004
    # A long hold counts once. The plunger must return below this threshold for
    # two consecutive control steps before another press can be counted.
    release_depth_threshold: 0.001
    release_dwell_steps: 2
    require_physical_button_motion: true

recording:
  record_depth: true
  depth_dtype: uint16
  depth_scale: 0.001
  action_schema: membench.pandaomron_hybrid13.v2
