[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MobileMemBench"
version = "0.1.0rc1"
description = "Nine-task mobile manipulation memory evaluation benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["msgpack>=1.0", "pydantic>=2.5", "pyyaml>=6.0", "simpleeval>=0.9.13", "numpy>=1.24", "websockets>=12.0"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=7"]

[project.scripts]
membench-eval = "bench.evaluation.release_cli:main"
membench-summarize = "scripts.eval.summarize_run:main"
membench-replay = "scripts.eval.replay_run_actions:main"
membench-serve-fake = "scripts.serve.serve_fake:main"
membench-serve-lerobot = "scripts.serve.serve_lerobot:main"
membench-serve-openpi = "scripts.serve.serve_openpi:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*", "configs*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.xml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["policy_e2e: policy protocol integration requiring localhost sockets"]
