[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MobileMemBench"
version = "0.1.0"
description = "MobileMemBench: mobile manipulation memory benchmark on RoboCasa"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MobileMemBench authors"}]

# Lightweight project deps. RoboCasa, robosuite, and MPlib are installed
# separately from source / pinned versions as documented in README.md.
dependencies = [
    "msgpack>=1.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "simpleeval>=0.9.13",
    "numpy>=1.24",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]
video = [
    "opencv-python-headless>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires simulator, network, or external policy dependencies",
    "unit: simulator-free unit tests",
    "contract: cross-layer configuration and API contract tests",
    "simulator: requires or validates the RoboCasa / MuJoCo runtime boundary",
    "policy_e2e: end-to-end policy protocol tests",
    "release_gate: immutable benchmark release checks",
    "external_policy: requires a separately running policy server",
]
